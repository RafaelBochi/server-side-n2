services:
  postgres:
    image: postgres:16-alpine
    container_name: api-assinantes-postgres
    environment:
      POSTGRES_USER: assinantes
      POSTGRES_PASSWORD: assinantes
      POSTGRES_DB: assinantes
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assinantes -d assinantes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
